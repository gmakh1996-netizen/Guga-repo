<!DOCTYPE html>
<html lang="ka">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}{{ site_name }}{% endblock %}</title>
  <link rel="icon" href="{{ url_for('static', filename='favicon.ico') }}?v=cyan" sizes="any">
  <link rel="icon" type="image/png" href="{{ url_for('static', filename='favicon.png') }}?v=cyan">
  <link rel="stylesheet" href="{{ url_for('static', filename='theme/web/plugins/swiper/swiper-bundle.min.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='theme/web/plugins/bootstrap/css/bootstrap.min.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='theme/web/plugins/select2/css/select2.min.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='theme/web/css/style.min.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='theme/web/css/styles.css') }}">
  {% block head %}{% endblock %}
  <link rel="stylesheet" href="{{ url_for('static', filename='fonts/noto.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='fonts/bpg.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/ge-custom.css') }}">
</head>
<body>
{% set path = request.path %}
<section class="content">
  <header class="header">
    <div class="container">
      <div class="row">
        <div class="col-md-12">
          <div class="header-top">
            <div class="header-top__logo">
              <a href="/"><img src="{{ url_for('static', filename='img/logo.png') }}" alt="{{ site_name }}"></a>
            </div>
            {% include "_navbar.html" %}
            <button type="button" class="header-search-toggle" id="headerSearchToggle" aria-label="ძებნა">
              <i class="icofont-search"></i>
            </button>
            <div class="header-top__search" id="headerTopSearch">
              <button type="button" class="header-search-close" id="headerSearchClose" aria-label="დახურვა">&times;</button>
              <form id="SearchMovie" action="/browse" autocomplete="off">
                <input type="hidden" name="type" value="search">
                <input type="text" id="search" name="search" autocomplete="off" placeholder="საძიებო სიტყვა...">
                <button type="submit"><i class="icofont-search"></i> ძებნა</button>
              </form>
              <div id="search_autocomplete"></div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </header>

  {% block content %}{% endblock %}
</section>

<div class="ge-popup-ad" id="adPopup">
  <button type="button" class="ge-popup-ad__close" id="adPopupClose" aria-label="დახურვა">&times;</button>
  <img src="{{ url_for('static', filename='img/popup-ad.jpg') }}" alt="სარეკლამო ბანერი">
</div>

<script src="{{ url_for('static', filename='theme/web/js/int.js') }}"></script>
<script src="{{ url_for('static', filename='js/app.js') }}"></script>
{% block scripts %}{% endblock %}
</body>
</html>
