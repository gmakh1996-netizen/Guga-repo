{% extends "base.html" %}
{% block title %}{{ site_name }} ფილმები და სერიალები ქართულად{% endblock %}

{% block content %}
  <section class="hero">
    <div class="container">
      <div class="row">
        <div class="col-md-12">
          <div class="ge-hero" id="HeroSlider" data-type="movie" data-sort="hero_top" data-exclude-genre="900000025">
            <a class="ge-hero__featured" id="heroFeatured" href="#">
              <div class="ge-hero__bg" id="heroBg"></div>
              <div class="ge-hero__info">
                <span class="ge-hero__play">ფილმის ყურება</span>
                <h2 class="ge-hero__title" id="heroTitle"></h2>
                <div class="ge-hero__meta">
                  <span class="ge-hero__genres" id="heroGenres"></span>
                  <span class="imdb-badge" id="heroImdb"></span>
                </div>
              </div>
            </a>
            <div class="ge-hero__thumbs" id="heroThumbs"></div>
          </div>
        </div>
      </div>
    </div>
  </section>

  <div class="ge-ad-banner">
    <div class="container"><div class="row"><div class="col-md-12">
      <div class="ge-ad-banner__inner">შენი ბანერი იქნება აქ — დაგვიკავშირდით</div>
    </div></div></div>
  </div>

  <div id="rows">
    <div class="cw-row" id="cwRow" data-title="განაგრძე ყურება" data-icon="resume"></div>
    <div class="movies-row" data-title="ფილმები ქართულად"          data-icon="film"    data-type="movie"  data-sort="trending" data-exclude-genre="900000025"></div>
    <div class="movies-row" data-title="ტოპ ფილმები"               data-icon="top"     data-type="movie"  data-sort="weekly_top" data-layout="top9" data-exclude-genre="900000025"></div>
    <div class="movies-row" data-title="სერიალები ქართულად"        data-icon="tv"      data-type="serial" data-sort="recent" data-exclude-genre="900000025"></div>
    <div class="movies-row" data-title="ტოპ სერიალები"             data-icon="top"     data-type="serial" data-sort="weekly_top" data-layout="top9" data-exclude-genre="900000025"></div>
    <div class="movies-row" data-title="პრემიერა"                 data-icon="premiere" data-type="movie" data-sort="recent" data-portrait="1" data-exclude-genre="900000025"></div>
    <div class="movies-row" data-title="ახალი დამატებული ფილმები"   data-icon="newfilm" data-type="movie"  data-sort="recent" data-exclude-genre="900000025"></div>
    <div class="movies-row" data-title="ახალი დამატებული ეპიზოდები" data-icon="newtv"   data-type="serial" data-sort="recent" data-exclude-genre="900000025"></div>
    <div class="movies-row" data-title="ანიმე სერიალები ქართულად" data-icon="sparkles" data-type="serial" data-sort="recent" data-portrait="1" data-genre="900000025"></div>
    <div id="recentEpisodesRow" data-title="ბოლოს დამატებული ეპიზოდები" data-icon="newtv"></div>
    <div class="movies-row" data-title="ანიმეები ქართულად"        data-icon="sparkles" data-type="movie" data-sort="recent" data-portrait="1" data-genre="900000025"></div>
  </div>
{% endblock %}
