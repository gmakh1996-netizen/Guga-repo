{% extends "base.html" %}
{% block title %}მსახიობები — {{ site_name }}{% endblock %}
{% block content %}
<div class="filter movie-list filter-redesign">
  <div class="container">
    <div class="ge-row-head" style="margin-top:24px">
      <div class="ge-head-left">
        <svg class="ge-ico" viewBox="0 0 24 24"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>
        <h2 class="ge-section-title">მსახიობები</h2>
      </div>
    </div>
    <div class="row" id="personsResults"></div>
    <p class="ge-empty" id="personsEmpty" hidden>მსახიობი ვერ მოიძებნა.</p>
    <div id="personsSentinel" style="height:1px"></div>
    <div class="ge-loader" id="personsLoader" hidden>იტვირთება…</div>
  </div>
</div>
{% endblock %}
